<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff1d6">
    <title>Turns Anything Into Squishy :3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html, body{
            width: 100%;
            height: 100%;
            overflow: hidden;          /* no scroll gap on phones */
            background: #fff1d6;       /* cream, matches the 3D scene */
            overscroll-behavior: none; /* no pull-to-refresh while dragging */
        }
        canvas{
            display: block;            /* removes the small gap under the canvas */
        }
    </style>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <script type="module" src="script.js"></script>
    
</body>
</html>
